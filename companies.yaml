# Companies the daily job scanner checks.
#
# Format (kept simple on purpose so it parses with the standard library):
#
#   - name: Company Name
#     board: greenhouse | lever | ashby | auto
#     slugs: slug1, slug2
#
# board "auto" tries Greenhouse, Lever, and Ashby for every slug listed and
# keeps the first one that answers with a job list. Set board explicitly once
# you know which one a company uses; that saves requests.
#
# A company whose slugs all fail is listed in the "Skipped companies" section
# of the report. Companies on Workday, SuccessFactors, or iCIMS have no public
# JSON board and will always land there unless they move.

companies:
  - name: Moderna
    board: auto
    slugs: modernatx, moderna

  - name: Vertex Pharmaceuticals
    board: auto
    slugs: vertex, vertexpharmaceuticals, vrtx

  - name: Takeda
    board: auto
    slugs: takeda

